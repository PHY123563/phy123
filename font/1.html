<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG图标</title>
    <script src="https://at.alicdn.com/t/c/font_5231973_e8gkmgiq3m.js"></script>
    <link rel="stylesheet" href="./1.css">
    <style>
</style>
</head>
<body>
   <h3>SVG图标</h3>
    <div class="tab-nav">
        <div class="tab-item active" onclick="changeTab(this)">
            <svg class="icon" aria-hidden="true">
                <use xlink:href="#icon-pinpaihedui"></use>
            </svg>
              <span>首页</span>
        </div class="budget-dot" id="budget-home"></div>
        </div>
         <div class="tab-item" onclick="changeTab(this)">
            <svg class="icon" aria-hidden="true">
                <use xlink:href="#icon-xinzeng"></use>
            </svg>
              <span>我的</span>
              <div class="bydget-dot max" id=""budget-my">100+</div>
        </div>
         <div class="tab-item" onclick="changeTab(this)">
            <svg class="icon" aria-hidden="true">
                <use xlink:href="#icon-pinpaihedui"></use>
            </svg>
              <span>购物车</span>
        </div>
         <div class="tab-item" onclick="changeTab(this)">
            <svg class="icon" aria-hidden="true">
                <use xlink:href="#icon-a-231_xinyongkahuandai"></use>
            </svg>
              <span>收藏</span>
        </div>
    </div>
    <script>
        // 写一个函数，当我点击当天的item时候，颜色发生变化
        function changeTab(current){
            let tabs=document.querySelectorAll('.tab-item');
            for(let i=0;i<tabs.length;i++){
                tabs[i].classList.remove('active');
            }
        //2.给当前点击的加上active高亮
        current.classList.add('active');
        }
    </script>
</body>
</html>
