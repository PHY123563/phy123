<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!--
作者：潘贺杨
创建时间：2026-10-15 09:00:00
模型：未知（历史页面，规则追溯）
功能：诗词列表展示页
-->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>诗词列表</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f5f7;
    padding: 20px 12px 40px;
  }
  h1 {
    font-size: 20px;
    text-align: center;
    color: #333;
    margin-bottom: 18px;
    letter-spacing: 2px;
  }
  .list {
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 2px 10px rgba(0, 0, 0, .08);
  }
  .card img {
    display: block;
    width: 100%;
    height: 200px;
    object-fit: cover;
    background: #eee;
  }
  .card .text { padding: 14px 16px 18px; }
  .card .title {
    font-size: 17px;
    font-weight: 600;
    color: #222;
    margin-bottom: 8px;
  }
  .card .content {
    font-size: 14px;
    line-height: 1.7;
    color: #666;
  }
  .tip {
    text-align: center;
    font-size: 14px;
    color: #999;
    margin-top: 24px;
  }
</style>
</head>
<body>
  <h1>诗词列表</h1>
  <div class="list" id="list"></div>

  <script>
    const API = 'http://localhost:3004/api/poems';
    const list = document.getElementById('list');

    // 功能：请求诗词接口，将返回数据渲染为卡片列表
    fetch(API)
      .then(res => res.json())
      .then(poems => {
        console.log('接口返回：', poems);
        list.innerHTML = poems.map(item => `
          <div class="card">
            <img src="${item.pic}" alt="${item.title}">
            <div class="text">
              <div class="title">${item.title}</div>
              <div class="content">${item.content}</div>
            </div>
          </div>
        `).join('');
      })
      .catch(err => {
        console.error('请求失败：', err);
        list.innerHTML = '<p class="tip">数据加载失败，请先启动服务器：在 db 文件夹执行 node server.js</p>';
      });
  </script>
</body>
</html>
