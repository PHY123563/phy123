<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!--
    作者：潘贺杨
    创建时间：2026-10-20 14:00:00
    模型：未知（历史页面，规则追溯）
    功能：练习 08 — 事件的冒泡与捕获
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>事件的冒泡与捕获</title>
    <style>
        .box {
            width: 400px;
            height: 400px;
            background-color: red;
        }
        #h2 {
            width: 200px;
            height: 200px;
            background-color: blue;
        }
        #em {
            width: 100px;
            height: 100px;
            background-color: yellow;
        }
    </style>
    <!-- 冒泡：事件会从最里层开始，逐层向上传播，直到document对象。
     ——冒泡是从子元素到父元素依次触发 
     捕获：事件会从最外层开始，逐层向下传播。先出发父元素，再触发子元素
-->
</head>
<body>
    <button  id="myButton" onclick="clickFun()">点击事件</button>
    <div class="box" id="box" >
        <h2 id="h2">是冒泡还是<em id="em">捕获</em></h2>
    </div>
    <input type="text" id="input" placeholder="请输入内容">
    <script>
        // 功能：按钮点击事件，弹出提示
        function clickFun() {
            alert("点击事件");
        }
        var box = document.getElementById("box");
//只有在id选择器可以直接使用box，也就是上面获取元素可以省
        // 功能：box 点击冒泡监听，弹出提示
        box.addEventListener("click", function () {
            alert("box");
        }, false); //false表示冒泡，true表示捕获
        var h2 = document.getElementById("h2");
        // 功能：h2 点击冒泡监听，弹出提示
        h2.addEventListener("click", function () {
            alert("h2");
        }, false);
        //var box = document.getElementById("em");
        var em = document.getElementById("em");
        // 功能：em 点击冒泡监听，弹出提示并阻止冒泡
        em.addEventListener("click", function () {
            alert("em");
            stopPropagation();//阻止事件冒泡
        }, false);
    </script>
</body>
</html>
