<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抓小球游戏|函数的三个方法应用</title>
    <style>
        body {
            background: #f0f0f0;
            overflow: hidden;
            font-size: 24px;
        }
        #info {
            padding: 16px;
            background: #222;
            color: #fff;
        }
        .ball {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: red;
        }
    </style>
</head>
<body>
    <div id="info">当前分数：<span id="score">0</span></div>
    <div class="ball" id="ball"></div>
    <script>
    //const是常量指的是变量的引用地址不变，不是变量里是数据不能变
    const game={
        score:0,
        ballDom:document.getElementById("ball"),
        width:50,
        height:50
    };//需要什么函数：小球移动，点击等
    function moveBall() {
        //保证小球在屏幕内
        const maxX = window.innerWidth - game.width;
        const maxY = window.innerHeight - game.height;
        //小球随机位置是0，窗口宽度取整
        const randomx = Math.floor(Math.random() * maxX);
        const randomy = Math.floor(Math.random() * maxY);
        //移动小球
        game.ballDom.style.left = randomx + "px";
        game.ballDom.style.top = randomy + "px";
    }
    
    </script>  
</body>
</html>
