<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="移动端底部导航 · iconfont 字体图标方式">
    <title>移动端底部导航 · 字体图标</title>
    <link rel="stylesheet" href="font/iconfont.css">
    <style>
        :root {
            --phy-paper: #f5f1e8;
            --phy-white: #fffdf8;
            --phy-ink: #17202a;
            --phy-muted: #66737d;
            --phy-coral: #ef6f61;
            --phy-gold: #f5c451;
            --phy-teal: #2c8c88;
            --phy-line: rgba(23, 32, 42, .14);
            --phy-badge-size: 20px;
            --phy-dot-size: 10px;
            --phy-nav-h: 72px;
            --phy-max-width: 480px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body {
            margin: 0;
            padding: 0;
            background: var(--phy-paper);
            color: var(--phy-ink);
            font-family: "Microsoft YaHei", Georgia, serif;
            line-height: 1.5;
        }

        a { color: inherit; text-decoration: none; }

        /* ===== 模拟移动端壳 ===== */
        .phy-phone-shell {
            max-width: var(--phy-max-width);
            margin: 0 auto;
            min-height: 100vh;
            background: var(--phy-paper);
            position: relative;
            box-shadow: 0 0 60px rgba(23, 32, 42, .08);
        }

        /* ===== 顶部状态栏 ===== */
        .phy-status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 24px 8px;
            font-family: -apple-system, sans-serif;
            font-size: 13px;
            font-weight: 600;
        }

        /* ===== 页面头部 ===== */
        .phy-header {
            padding: 16px 24px 12px;
            border-bottom: 1px solid var(--phy-line);
        }

        .phy-title {
            font-family: Georgia, serif;
            font-size: 22px;
            margin: 0 0 4px;
            font-weight: 400;
        }

        .phy-subtitle {
            font-size: 12px;
            color: var(--phy-muted);
            margin: 0;
            letter-spacing: .08em;
        }

        /* ===== 内容区 ===== */
        .phy-content {
            padding: 16px 24px calc(var(--phy-nav-h) + 40px);
        }

        .phy-card {
            background: var(--phy-white);
            border: 1px solid var(--phy-line);
            border-radius: 16px;
            padding: 18px 20px;
            margin-bottom: 14px;
        }

        .phy-card-title {
            margin: 0 0 6px;
            font-size: 15px;
            font-weight: 500;
        }

        .phy-card-text {
            margin: 0;
            font-size: 13px;
            color: var(--phy-muted);
        }

        /* ===== 底部导航 ===== */
        .phy-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: var(--phy-max-width);
            height: var(--phy-nav-h);
            background: rgba(255, 253, 248, .96);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid var(--phy-line);
            display: flex;
            justify-content: space-around;
            align-items: stretch;
            padding-bottom: env(safe-area-inset-bottom);
            z-index: 100;
            box-shadow: 0 -4px 20px rgba(23, 32, 42, .04);
        }

        .phy-nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            transition: color .25s ease;
            padding: 6px 0;
        }

        .phy-nav-icon-wrap {
            position: relative;
            display: inline-block;
            line-height: 1;
        }

        .phy-nav-icon {
            font-family: "iconfont" !important;
            font-size: 24px;
            font-style: normal;
            color: var(--phy-muted);
            transition: color .25s ease, transform .25s ease;
        }

        .phy-nav-label {
            font-size: 11px;
            color: var(--phy-muted);
            margin-top: 4px;
            letter-spacing: .04em;
            transition: color .25s ease;
        }

        /* 数字徽章 */
        .phy-badge {
            position: absolute;
            top: -6px;
            right: -12px;
            min-width: var(--phy-badge-size);
            height: var(--phy-badge-size);
            padding: 0 5px;
            background: var(--phy-coral);
            color: #fff;
            font-size: 11px;
            line-height: var(--phy-badge-size);
            border-radius: calc(var(--phy-badge-size) / 2);
            text-align: center;
            font-weight: 600;
            box-shadow: 0 2px 6px rgba(239, 111, 97, .35);
        }

        /* 红点 */
        .phy-dot {
            position: absolute;
            top: 0;
            right: -4px;
            width: var(--phy-dot-size);
            height: var(--phy-dot-size);
            background: var(--phy-coral);
            border-radius: 50%;
            box-shadow: 0 0 0 2px var(--phy-white);
            animation: phy-pulse 2s infinite;
        }

        @keyframes phy-pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.15); opacity: .85; }
        }

        /* 活动态 */
        .phy-nav-item.is-active .phy-nav-icon {
            color: var(--phy-ink);
            transform: scale(1.05);
        }

        .phy-nav-item.is-active .phy-nav-label {
            color: var(--phy-ink);
            font-weight: 600;
        }

        /* 点击微反馈 */
        .phy-nav-item:active .phy-nav-icon {
            transform: scale(.9);
        }
    </style>
</head>
<body>
    <div class="phy-phone-shell">
        <!-- 模拟移动端状态栏 -->
        <div class="phy-status-bar">
            <span>9:41</span>
            <span>●●●●●</span>
        </div>

        <!-- 页面头部 -->
        <header class="phy-header">
            <h1 class="phy-title">字体图标导航</h1>
            <p class="phy-subtitle">ICONFONT · FONT ICON · 移动端固定底部导航</p>
        </header>

        <!-- 内容占位 -->
        <main class="phy-content">
            <div class="phy-card">
                <h2 class="phy-card-title">导航说明</h2>
                <p class="phy-card-text">底部固定 4 项导航：搜索（带 8 条未读数字徽章）、保存（带红点）、品牌核对（活动态）、地址。所有图标来自项目 font/ 目录的 iconfont 字体。</p>
            </div>
            <div class="phy-card">
                <h2 class="phy-card-title">数字徽章 & 红点</h2>
                <p class="phy-card-text">右上角红色圆形为数字徽章（badge），显示未读数量；小红点为提示（dot），带轻微脉冲动画。</p>
            </div>
            <div class="phy-card">
                <h2 class="phy-card-title">实验</h2>
                <p class="phy-card-text">点击不同导航项，观察图标与文字的活动态切换；点击"搜索"项的徽章区域，数字会递减。</p>
            </div>
        </main>

        <!-- 底部导航 -->
        <nav class="phy-nav" id="phy_nav">
            <a class="phy-nav-item is-active" data-phy-target="search" href="javascript:void(0)">
                <span class="phy-nav-icon-wrap">
                    <i class="iconfont icon-sousuo phy-nav-icon"></i>
                    <span class="phy-badge" id="phy_badge_search">8</span>
                </span>
                <span class="phy-nav-label">搜索</span>
            </a>

            <a class="phy-nav-item" data-phy-target="save" href="javascript:void(0)">
                <span class="phy-nav-icon-wrap">
                    <i class="iconfont icon-baocun phy-nav-icon"></i>
                    <span class="phy-dot" id="phy_dot_save"></span>
                </span>
                <span class="phy-nav-label">保存</span>
            </a>

            <a class="phy-nav-item" data-phy-target="brand" href="javascript:void(0)">
                <span class="phy-nav-icon-wrap">
                    <i class="iconfont icon-pinpaihedui phy-nav-icon"></i>
                </span>
                <span class="phy-nav-label">品牌</span>
            </a>

            <a class="phy-nav-item" data-phy-target="address" href="javascript:void(0)">
                <span class="phy-nav-icon-wrap">
                    <i class="iconfont icon-dizhi phy-nav-icon"></i>
                </span>
                <span class="phy-nav-label">地址</span>
            </a>
        </nav>
    </div>

    <script>
        var phy_items = document.querySelectorAll('.phy-nav-item');
        phy_items.forEach(function (phy_item) {
            phy_item.addEventListener('click', function () {
                phy_items.forEach(function (phy_i) { phy_i.classList.remove('is-active'); });
                phy_item.classList.add('is-active');
            });
        });

        var phy_badge = document.getElementById('phy_badge_search');
        if (phy_badge) {
            phy_badge.addEventListener('click', function (phy_evt) {
                phy_evt.stopPropagation();
                var phy_val = parseInt(phy_badge.textContent, 10);
                if (phy_val > 1) {
                    phy_badge.textContent = phy_val - 1;
                } else {
                    phy_badge.style.display = 'none';
                }
            });
        }

        var phy_dot = document.getElementById('phy_dot_save');
        if (phy_dot) {
            phy_dot.addEventListener('click', function (phy_evt) {
                phy_evt.stopPropagation();
                phy_dot.style.display = 'none';
            });
        }
    </script>
</body>
</html>
